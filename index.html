<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Tiêu đề hiển thị trên trình duyệt và SEO -->
    <title>Codec - Bán hàng online nhanh chóng & tiện lợi</title>

    <!-- Mô tả ngắn gọn cho SEO -->
    <meta
      name="description"
      content="Codec - Nền tảng bán hàng online giúp bạn quản lý sản phẩm, đơn hàng, khách hàng dễ dàng. Giao diện đẹp, tối ưu trải nghiệm và tốc độ."
    />

    <!-- Từ khóa SEO (ít tác dụng hiện nay, nhưng vẫn có thể thêm) -->
    <meta
      name="keywords"
      content="bán hàng online, quản lý đơn hàng, codec, thương mại điện tử, shop online"
    />

    <!-- Thông tin tác giả -->
    <meta name="author" content="Codec Team" />

    <!-- Open Graph cho Facebook, Zalo... -->
    <meta property="og:title" content="Codec - Bán hàng online nhanh chóng & tiện lợi" />
    <meta
      property="og:description"
      content="Codec giúp bạn kinh doanh online hiệu quả với công cụ quản lý mạnh mẽ, giao diện thân thiện và tốc độ nhanh."
    />
    <meta property="og:image" content="/images/logo.png" />
    <meta property="og:url" content="https://codec.vn" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Codec - Bán hàng online nhanh chóng & tiện lợi" />
    <meta
      name="twitter:description"
      content="Codec giúp bạn kinh doanh online hiệu quả với công cụ quản lý mạnh mẽ, giao diện thân thiện và tốc độ nhanh."
    />
    <meta name="twitter:image" content="/images/logo.png" />

    <!-- Thêm canonical để tránh trùng lặp nội dung -->
    <link rel="canonical" href="https://codec.vn" />

    <!-- CSS -->
    <!-- <link href="/src/styles.css" rel="stylesheet" /> -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
